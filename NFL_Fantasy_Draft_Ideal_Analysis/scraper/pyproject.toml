[project]
name = "waiver"
version = "0.1.0"
description = "Phase 3 waiver-wire scraper: Sleeper trending add/drop data into FANTASY.RAW"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.0",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.7"]

[project.scripts]
waiver = "waiver.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
